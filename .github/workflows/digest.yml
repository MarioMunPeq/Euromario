name: Pipeline de noticias

on:
  schedule:
    # 2 ejecuciones al día a las 07:23 y 19:23 hora de Madrid.
    #
    # El minuto 23 NO es arbitrario: GitHub documenta que los workflows
    # programados se retrasan con cargas altas y que "high load times include
    # the start of every hour". Con `0 7` (en punto) el retraso medido llegó a
    # 5 h 52 m. Mover el disparo fuera de la cúspide es la única palanca que la
    # propia documentación reconoce.
    #
    # Bajamos de 4 a 2 ejecuciones: cada una hace ~22 llamadas a Groq, y con
    # 4 el free tier empezaba a devolver 429 (14 esperas de 5-20 s en un solo
    # run). A 2 ejecuciones quedan muy por debajo del límite. El trade-off es
    # que el desfase máximo de la web pasa de ~1,5 h a ~3 h; con el retraso de
    # fondo que ya tienen, la diferencia es marginal.
    #
    # `timezone` está soportado (IANA, con DST), así que 07:23 es 07:23 en
    # Madrid todo el año: en verano CEST y en invierno CET.
    - cron: "23 7,19 * * *"
      timezone: "Europe/Madrid"

  # Regenerar el digest al tocar config o código del pipeline, sin esperar al cron.
  push:
    branches: [master]
    paths:
      - "config/**"
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/digest.yml"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  # Una ejecución programada que tarda 55 min bloquea a las siguientes. Como el
  # digest se regenera desde cero siempre, una ejecución más nueva deja obsoleta
  # a la anterior: se cancela. Los runs manuales NUNCA se cancelan, para poder
  # depurar sin que les salpiente una ejecución programada de fondo.
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

env:
  PYTHONPATH: src
  OLLAMA_MODEL: llama3.2:3b
  # A nivel de JOB (no de paso) para que los `if:` de los pasos puedan leerlo:
  # los secretos no son accesibles directamente en condiciones, sí vía `env`.
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  # `openai/gpt-oss-20b` es un modelo de razonamiento: emitía su análisis en un
  # canal aparte que el parser no entendía y NINGUNA llamada devolvió JSON
  # válido (0 de 22 en el run del 2026-10-14, con 22 de 66 tarjetas publicadas
  # sin resumen). Para cambiar de modelo basta con editar esta variable.
  GROQ_MODEL: llama-3.3-70b-versatile

jobs:
  actualizar-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Ollama solo se instala si NO hay clave de Groq. Con clave, el pipeline
      # arranca directamente contra Groq (~1-3 s por noticia) y se ahorra el
      # install + la descarga del modelo (~1 min, y varios más si falla caché).
      - name: Caché de modelos Ollama
        if: ${{ env.GROQ_API_KEY == '' }}
        uses: actions/cache@v4
        with:
          # El modelo se descarga cada día (~1-2 GB); cachearlo entre
          # ejecuciones reduce el tiempo de arranque del runner.
          path: ~/.ollama/models
          key: ollama-models-${{ env.OLLAMA_MODEL }}
          restore-keys: |
            ollama-models-

      - name: Instalar e iniciar Ollama
        id: ollama
        if: ${{ env.GROQ_API_KEY == '' }}
        continue-on-error: true
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          echo "Ollama PID: $!"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama listo tras ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Ollama no arrancó en 30s"
              cat /tmp/ollama.log
              exit 1
            fi
            sleep 1
          done
          ollama pull "$OLLAMA_MODEL"

      # `always()` sin más: el pipeline corre también cuando el paso de Ollama
      # se omite (porque hay clave de Groq) o falla. Antes se condicionaba a
      # `steps.ollama.outcome != 'skipped'`, lo que se saltaría el pipeline
      # entero justo en el caso de Groq.
      - name: Ejecutar pipeline
        if: always()
        run: python -m gaming_news_digest

      # `always()` para que un fallo del pipeline no deje la web sin desplegar:
      # los datos válidos del último run siguen siendo mejores que nada.
      - name: Commit de los datos actualizados
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
            exit 0
          fi
          git commit -m "chore(datos): actualizar digest automático"
          # Rebase antes de subir: si algo entró al repo mientras corríamos
          # (un push manual, otra ejecución), el push directo fallaría DESPUÉS
          # de haber hecho todo el trabajo y se perdería el digest.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push fallido (intento ${attempt}/3); reintentando en 10s"
            sleep 10
          done
          echo "::error::No se pudieron subir los datos tras 3 intentos"
          exit 1

      - name: Configure Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - id: deployment
        name: Deploy to GitHub Pages
        if: always()
        uses: actions/deploy-pages@v4