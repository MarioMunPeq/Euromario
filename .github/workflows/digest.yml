name: Pipeline de noticias

on:
  schedule:
    - cron: "17 * * * *" # cada hora (minuto no puntual para evitar cola de scheduling de GH Actions)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

env:
  PYTHONPATH: src
  OLLAMA_MODEL: llama3.2:3b

jobs:
  actualizar-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar e iniciar Ollama
        id: ollama
        continue-on-error: true
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          echo "Ollama PID: $!"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama listo tras ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Ollama no arrancÃ³ en 30s"
              cat /tmp/ollama.log
              exit 1
            fi
            sleep 1
          done
          ollama pull "$OLLAMA_MODEL"

      - name: Ejecutar pipeline
        if: always() && steps.ollama.outcome != 'skipped'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m gaming_news_digest

      - name: Commit de los datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "chore(datos): actualizar digest automÃ¡tico"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
