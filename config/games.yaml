# Listas de seguimiento del filtro de contenido.
#
# - incluir: juegos/sagas de los que SÍ se quieren ver noticias.
# - excluir: juegos que NO se quieren ver NUNCA; tiene prioridad sobre `incluir`.
#
# Cada entrada admite un nombre canónico y una lista de aliases
# (abreviaturas, secuelas, nombres alternativos). El matcher usa límites
# de palabra, por lo que los aliases cortos (ej. "GTA") son seguros.
#
# Campos opcionales:
#   logo: slug del SVG en frontend/assets/games/ (sin extensión → .svg)
#   platform: lista de plataformas (pc, playstation, xbox, nintendo)
#             Steam NO va aquí — se deriva de source.type == "steam"
#
# El nombre DEBE coincidir exactamente con el que el matcher asigna
# a las noticias. Ejemplo: "Baldur's Gate 3", NO "Baldur's Gate".
#
# Para editar: modifica este archivo y haz commit; la siguiente ejecución
# horaria del pipeline ya lo aplica. No hace falta tocar código.

incluir:
  # ── Originales (ya existían) ──────────────────────────────
  - nombre: Grand Theft Auto
    aliases: [GTA]
    logo: gta.svg
    platform: [pc, playstation, xbox]
  - nombre: Call of Duty
    aliases: [CoD]
    logo: call-of-duty.svg
    platform: [pc, playstation, xbox]
  - nombre: Persona
    aliases: []
    logo: persona.svg
    platform: [playstation, pc]
  - nombre: The Legend of Zelda
    aliases: [Zelda]
    logo: zelda.svg
    platform: [nintendo]

  # ── Nuevos: con SVG ───────────────────────────────────────
  - nombre: Baldur's Gate 3
    aliases: [BG3]
    logo: baldurs-gate.svg
    platform: [pc, playstation, xbox]
  - nombre: Elden Ring
    aliases: [ER]
    logo: elden-ring.svg
    platform: [pc, playstation, xbox]
  - nombre: Hollow Knight
    aliases: [HK]
    logo: hollow-knight.svg
    platform: [pc, playstation, xbox, nintendo]
  - nombre: Pokemon
    aliases: [Pokémon]
    logo: pokemon.svg
    platform: [nintendo]
  - nombre: PUBG
    aliases: []
    logo: pubg.svg
    platform: [pc, playstation, xbox]
  - nombre: Rainbow Six
    aliases: [R6]
    logo: rainbow-six.svg
    platform: [pc, playstation, xbox]
  - nombre: Roblox
    aliases: []
    logo: roblox.svg
    platform: [pc, playstation, xbox]

  # ── Nuevos: sin SVG (fallback a inicial en frontend) ──────
  - nombre: Cyberpunk 2077
    aliases: [CP2077]
    logo: null
    platform: [pc, playstation, xbox]
  - nombre: Final Fantasy VII
    aliases: [FF7, FFVII]
    logo: null
    platform: [playstation, pc]
  - nombre: Helldivers 2
    aliases: [HD2]
    logo: null
    platform: [pc, playstation]
  - nombre: Starfield
    aliases: []
    logo: null
    platform: [pc, xbox]

excluir:
  - nombre: EA Sports FC
    aliases: [FIFA]
  # ... ampliar aquí
