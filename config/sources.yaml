# Fuentes de noticias del pipeline.
#
# URLs concretas pendientes de validar al implementar los fetchers
# (especificación, sección 10); estas son puntos de partida razonables.

medios:
  - nombre: IGN
    feed: http://feeds.feedburner.com/ign/news
    idioma: en
  - nombre: Eurogamer
    feed: https://www.eurogamer.net/feed/news
    idioma: en
  - nombre: PC Gamer
    feed: https://www.pcgamer.com/rss/
    idioma: en
  - nombre: Polygon
    feed: https://www.polygon.com/rss/index.xml
    idioma: en
  - nombre: Rock Paper Shotgun
    feed: https://www.rockpapershotgun.com/feed
    idioma: en
  # Medios en español pendientes de definir (Vandal, 3DJuegos, MeriStation...)

steam:
  habilitado: true
  juegos:
    - app_id: 271590
      nombre: Grand Theft Auto
    - app_id: 1687950
      nombre: Persona
  # Añadir aquí las demás sagas seguidas con página en Steam

reddit:
  habilitado: true
  subreddits:
    - nombre: gamingleaks
      etiqueta: rumores
  # Subreddits de sagas concretas: se añadirán según crezca la lista de inclusión

limites:
  max_items_por_fuente: 20
  timeout_segundos: 15

calidad:
  excluir_titulos:
    - "^I turned "
    - "^I modded "
    - "^I'm modding "
    - "^Today in "
    - "\\bHelp$"
    - "\\bfull dong\\b"
    - "\\bnudity-filled\\b"
    - "\\bHe( facet )?s( )?\\b"
  excluir_urls:
    - "/hardware/"
    - "/humor/"
    - "/best-"
    - "/where-to-find"
    - "/how-to-"
