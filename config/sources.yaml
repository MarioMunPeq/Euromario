# Fuentes de noticias del pipeline.
#
# URLs concretas pendientes de validar al implementar los fetchers
# (especificación, sección 10); estas son puntos de partida razonables.

medios:
  - nombre: IGN
    feed: http://feeds.feedburner.com/ign/news
    idioma: en
  - nombre: Eurogamer
    feed: https://www.eurogamer.net/feed/news
    idioma: en
  - nombre: PC Gamer
    feed: https://www.pcgamer.com/rss/
    idioma: en
  - nombre: Polygon
    feed: https://www.polygon.com/rss/index.xml
    idioma: en
  - nombre: Rock Paper Shotgun
    feed: https://www.rockpapershotgun.com/feed
    idioma: en
  # Medios en español pendientes de definir (Vandal, 3DJuegos, MeriStation...)

steam:
  habilitado: true
  juegos:
    - app_id: 271590
      nombre: Grand Theft Auto
    - app_id: 1687950
      nombre: Persona
  # Añadir aquí las demás sagas seguidas con página en Steam

reddit:
  habilitado: true
  subreddits:
    - nombre: gamingleaksandrumours
      etiqueta: rumores
  # Subreddits de sagas concretas: se añadirán según crezca la lista de inclusión
  # Reddit (r/gamingleaksandrumours) es una fuente especial de rumores/leaks:
  # - No usa el límite general max_items_por_fuente; recoge todo lo que devuelva el RSS.
  # - Se salta el pre-límite por juego (max_stories_por_juego) antes de la IA.
  # - El post-límite tras la IA SÍ se aplica.
  # - Categoría forzada a "rumor", is_verified=False.

limites:
  max_items_por_fuente: 20
  max_items_por_fuente_reddit: 0  # 0 = sin límite (usa todo lo que devuelva el RSS)
  timeout_segundos: 15
  max_stories_por_juego: 8

calidad:
  excluir_titulos:
    - "^I turned "
    - "^I modded "
    - "^I'm modding "
    - "^Today in "
    - "\\bHelp$"
    - "\\bfull dong\\b"
    - "\\bnudity-filled\\b"
    - "\\bHe( facet )?s( )?\\b"
  excluir_urls:
    - "/hardware/"
    - "/humor/"
    - "/best-"
    - "/where-to-find"
    - "/how-to-"
