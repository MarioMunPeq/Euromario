<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true" focusable="false">
  <!-- Icono "Todos" (toda la biblioteca): tres anillos enlazados que convergen
       en un centro común. Reemplaza este archivo por tu propio SVG si lo deseas;
       el trazado debe ser blanco (#ffffff sobre fondo transparente), línea fina,
       centrado en un viewBox 0 0 24 24 para mantener el peso visual actual. -->
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round">
    <circle cx="8.4" cy="8.4" r="4.6"/>
    <circle cx="15.6" cy="8.4" r="4.6"/>
    <circle cx="12" cy="15.6" r="4.6"/>
  </g>
</svg>