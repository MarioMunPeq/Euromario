<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Gaming Digest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header__brand">
      <h1 class="header__title" id="app-title">Gaming Digest</h1>
    </div>
    <div class="header__controls">
      <div class="search-box" role="search">
        <label for="search" class="visually-hidden">Buscar noticias</label>
        <input type="search" id="search" placeholder="Buscar..." aria-label="Buscar noticias">
      </div>
    </div>
  </header>

  <main class="main">
    <section class="filters" aria-label="Filtros">
      <form class="filters__form" id="filters-form">
        <div class="filters__group">
          <label for="filter-game" class="visually-hidden">Juego</label>
          <select id="filter-game" multiple aria-label="Filtrar por juego">
            <option value="">Todos los juegos</option>
          </select>
        </div>
        <div class="filters__group">
          <label for="filter-category" class="visually-hidden">Categoría</label>
          <select id="filter-category" multiple aria-label="Filtrar por categoría">
            <option value="">Todas las categorías</option>
            <option value="lanzamiento">Lanzamiento</option>
            <option value="actualizacion">Actualización</option>
            <option value="rumor">Rumor</option>
            <option value="analisis">Análisis</option>
          </select>
        </div>
        <div class="filters__group filters__group--date">
          <label for="date-from" class="visually-hidden">Desde</label>
          <input type="date" id="date-from" aria-label="Fecha desde">
          <span class="date-separator" aria-hidden="true">–</span>
          <label for="date-to" class="visually-hidden">Hasta</label>
          <input type="date" id="date-to" aria-label="Fecha hasta">
        </div>
        <button type="button" class="btn btn--ghost" id="clear-filters" aria-label="Limpiar filtros">Limpiar</button>
      </form>
    </section>

    <section class="news-grid" id="news-grid" aria-live="polite" aria-label="Noticias">
      <div class="loading" id="loading" aria-live="assertive">
        <div class="spinner" aria-hidden="true"></div>
        <p>Cargando noticias...</p>
      </div>
      <div class="error" id="error" hidden>
        <svg class="error__icon" aria-hidden="true" viewBox="0 0 24 24" width="48" height="48">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="15" y1="9" x2="9" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="9" y1="9" x2="15" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h2 id="error-title">Error al cargar</h2>
        <p id="error-message">No se pudieron cargar las noticias.</p>
        <button type="button" class="btn" id="retry-btn">Reintentar</button>
      </div>
      <div class="empty" id="empty" hidden>
        <svg class="empty__icon" aria-hidden="true" viewBox="0 0 24 24" width="48" height="48">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z" fill="currentColor"/>
          <path d="M11 7h2v2h-2zm0 4h2v6h-2z" fill="currentColor" opacity="0.5"/>
        </svg>
        <h2>No hay noticias</h2>
        <p>No hay noticias que coincidan con los filtros actuales.</      </div>
      <div class="news-grid__list" id="news-list" role="list" aria-label="Noticias"></div>
    </section>
  </main>

  <footer class="footer">
    <p class="footer__stats" id="footer-stats">
      <span id="stats-count">0</span> noticias •
      <span id="stats-updated">—</span> •
      <a href="https://github.com/tu-usuario/gaming-news-digest" target="_blank" rel="noopener" class="footer__link">v0.1.0</a>
    </p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
