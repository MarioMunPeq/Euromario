<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0A0A0B">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>EuroMario — Gaming news, release radar &amp; rumors</title>
  <meta name="description" content="Daily AI-curated gaming digest: release dates, updates, rumors and analysis from the best sources, in one place.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="EuroMario">
  <meta property="og:title" content="EuroMario — Gaming news, release radar &amp; rumors">
  <meta property="og:description" content="Daily AI-curated gaming digest: release dates, updates, rumors and analysis from the best sources, in one place.">
  <meta property="og:url" content="https://mariomunpeq.github.io/Euromario/">
  <meta property="og:image" content="https://mariomunpeq.github.io/Euromario/assets/og-banner.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="EuroMario — Gaming news, release radar &amp; rumors">
  <meta name="twitter:description" content="Daily AI-curated gaming digest: release dates, updates, rumors and analysis from the best sources, in one place.">
  <meta name="twitter:image" content="https://mariomunpeq.github.io/Euromario/assets/og-banner.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <a href="/" class="header__brand" aria-label="EuroMario - Home">
        <img class="header__logo" src="assets/logo.svg" alt="" aria-hidden="true">
        <span class="header__title" id="app-title">EuroMario</span>
      </a>

      <nav class="header__nav" aria-label="Sections" role="radiogroup">
        <button type="button" class="header__nav-btn" data-section="news" role="radio" aria-checked="true">
          <img class="header__nav-icon" src="assets/icons/news.svg" alt="" aria-hidden="true" width="18" height="18">
          <span>NEWS</span>
        </button>
        <button type="button" class="header__nav-btn" data-section="rumors" role="radio" aria-checked="false">
          <img class="header__nav-icon" src="assets/icons/rumors.svg" alt="" aria-hidden="true" width="18" height="18">
          <span>RUMORS</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="main">
    <section class="filters" aria-label="Filters">
      <div class="filters__blocks" id="filter-blocks" role="group" aria-label="Platform and game filters">
        <div class="filters__platforms" id="filter-platforms" role="group" aria-label="Platforms"></div>
        <div class="filters__games" id="filter-games" role="group" aria-label="Games"></div>
      </div>
    </section>

    <section class="news-grid" id="news-grid" aria-live="polite" aria-label="News">
      <div class="state state--loading" id="state-loading" role="status" aria-live="polite" hidden>
        <div class="skeleton-grid" aria-hidden="true">
          <div class="skeleton-card">
            <div class="skeleton__media"></div>
            <div class="skeleton__body">
              <div class="skeleton__line w-40"></div>
              <div class="skeleton__line w-90"></div>
              <div class="skeleton__line w-75"></div>
              <div class="skeleton__line w-60"></div>
              <div class="skeleton__line w-35"></div>
            </div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton__media"></div>
            <div class="skeleton__body">
              <div class="skeleton__line w-40"></div>
              <div class="skeleton__line w-90"></div>
              <div class="skeleton__line w-75"></div>
              <div class="skeleton__line w-60"></div>
              <div class="skeleton__line w-35"></div>
            </div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton__media"></div>
            <div class="skeleton__body">
              <div class="skeleton__line w-40"></div>
              <div class="skeleton__line w-90"></div>
              <div class="skeleton__line w-75"></div>
              <div class="skeleton__line w-60"></div>
              <div class="skeleton__line w-35"></div>
            </div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton__media"></div>
            <div class="skeleton__body">
              <div class="skeleton__line w-40"></div>
              <div class="skeleton__line w-90"></div>
              <div class="skeleton__line w-75"></div>
              <div class="skeleton__line w-60"></div>
              <div class="skeleton__line w-35"></div>
            </div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton__media"></div>
            <div class="skeleton__body">
              <div class="skeleton__line w-40"></div>
              <div class="skeleton__line w-90"></div>
              <div class="skeleton__line w-75"></div>
              <div class="skeleton__line w-60"></div>
              <div class="skeleton__line w-35"></div>
            </div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton__media"></div>
            <div class="skeleton__body">
              <div class="skeleton__line w-40"></div>
              <div class="skeleton__line w-90"></div>
              <div class="skeleton__line w-75"></div>
              <div class="skeleton__line w-60"></div>
              <div class="skeleton__line w-35"></div>
            </div>
          </div>
        </div>
        <p class="state__label">Loading news&hellip;</p>
      </div>
      <div class="state state--error" id="state-error" hidden>
        <svg class="error__icon" aria-hidden="true" viewBox="0 0 24 24" width="48" height="48">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="15" y1="9" x2="9" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="9" y1="9" x2="15" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h2 id="error-title">Failed to load</h2>
        <p id="error-message">Could not load news.</p>
        <button type="button" class="btn btn--primary" id="retry-btn">Retry</button>
      </div>
      <div class="state state--empty" id="state-empty" hidden>
        <svg class="empty__icon" aria-hidden="true" viewBox="0 0 24 24" width="48" height="48">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z" fill="currentColor"/>
          <path d="M11 7h2v2h-2zm0 4h2v6h-2z" fill="currentColor" opacity="0.5"/>
        </svg>
        <h2>No news found</h2>
        <p>No news matches the current filters.</p>
        <button type="button" class="btn btn--primary" id="clear-filters-btn" hidden>Clear filters</button>
      </div>
      <div class="news-grid__list state" id="news-list" role="list" aria-label="News" hidden></div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
