<body>

  <!-- â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
       Top bar â€” brand Â· game filters Â· section switch
       â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• -->
  <header class="topbar">
    <div class="topbar__inner">

      <a href="./" class="brand" aria-label="EuroMario, home">
        <img class="brand__mark" src="assets/logo.svg" alt="" aria-hidden="true" width="30" height="30">
        <span class="brand__name" id="app-title">EuroMario</span>
      </a>

      <!-- Game filters. Populated from data/games.json (GTA, PokÃ©mon). -->
      <nav class="gamefilters" id="game-filters" aria-label="Filter by game" hidden></nav>

      <!-- Section switch. Single-select: All / News / Rumors. -->
      <div class="segments" role="radiogroup" aria-label="Filter by section">
        <button type="button" class="segments__btn" data-section="all" role="radio" aria-checked="true">
          <img class="segments__icon" src="assets/icons/all.svg" alt="" aria-hidden="true" width="17" height="17">
          <span class="segments__text">All</span>
        </button>
        <button type="button" class="segments__btn" data-section="news" role="radio" aria-checked="false">
          <img class="segments__icon" src="assets/icons/news.svg" alt="" aria-hidden="true" width="17" height="17">
          <span class="segments__text">News</span>
        </button>
        <button type="button" class="segments__btn" data-section="rumors" role="radio" aria-checked="false">
          <img class="segments__icon" src="assets/icons/rumors.svg" alt="" aria-hidden="true" width="17" height="17">
          <span class="segments__text">Rumors</span>
        </button>
      </div>

    </div>
  </header>

  <!-- â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
       Main
       â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• -->
  <main class="main" id="main">

    <!-- Result summary + active filter chip -->
    <div class="toolbar" id="toolbar" hidden>
      <p class="toolbar__count" id="toolbar-count"></p>
      <div class="toolbar__actions">
        <button type="button" class="chip chip--clear" id="clear-filters" hidden>
          <span id="clear-filters-label">Clear filters</span>
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- â”€â”€ Loading â”€â”€ -->
    <div class="panel" id="state-loading">
      <div class="skeletons" aria-hidden="true">
        <div class="skeleton"><div class="skeleton__media"></div><div class="skeleton__body"><span class="skeleton__line w-35"></span><span class="skeleton__line w-95"></span><span class="skeleton__line w-70"></span></div></div>
        <div class="skeleton"><div class="skeleton__media"></div><div class="skeleton__body"><span class="skeleton__line w-35"></span><span class="skeleton__line w-95"></span><span class="skeleton__line w-70"></span></div></div>
        <div class="skeleton"><div class="skeleton__media"></div><div class="skeleton__body"><span class="skeleton__line w-35"></span><span class="skeleton__line w-95"></span><span class="skeleton__line w-70"></span></div></div>
      </div>
      <p class="visually-hidden" role="status">Loading news</p>
    </div>

    <!-- â”€â”€ Error â”€â”€ -->
    <div class="panel panel--message" id="state-error" hidden>
      <svg class="panel__icon" viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M12 7.5v5.5M12 16.2v.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <h2 class="panel__title" id="error-title">Failed to load</h2>
      <p class="panel__body" id="error-message">Something went wrong.</p>
      <button type="button" class="btn" id="retry-btn">Try again</button>
    </div>

    <!-- â”€â”€ Empty â”€â”€ -->
    <div class="panel panel--message" id="state-empty" hidden>
      <svg class="panel__icon" viewBox="0 0 24 24" width="32" height="32" aria-hidden="true">
        <rect x="3.5" y="4.5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M7.5 9.5h9M7.5 13h6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <h2 class="panel__title">Nothing here yet</h2>
      <p class="panel__body">No stories match the current filters.</p>
      <button type="button" class="btn" id="empty-reset-btn" hidden>Clear filters</button>
    </div>

    <!-- â”€â”€ Cards â”€â”€ -->
    <section class="grid" id="news-grid" aria-label="Stories" hidden></section>

  </main>

  <!-- â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
       Footer
       â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• -->
  <footer class="footer">
    <div class="footer__inner">
      <p class="footer__brand">EuroMario</p>
      <p class="footer__note">AI-curated gaming digest Â· <span id="footer-updated">Updated daily</span></p>
    </div>
  </footer>

</body>
