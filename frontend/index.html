<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>EuroMario</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="header__top">
      <div class="header__brand">
        <h1 class="header__title" id="app-title">EuroMario</h1>
      </div>
      <div class="header__meta" id="header-meta" aria-live="polite">
        <span class="header__meta-item" id="header-count">0 noticias</span>
        <span class="header__meta-separator" aria-hidden="true">&middot;</span>
        <time class="header__meta-item" id="header-updated" datetime="">&mdash;</time>
      </div>
    </div>
    <div class="header__controls">
      <div class="search-box" role="search">
        <label for="search" class="visually-hidden">Buscar noticias</label>
        <input type="search" id="search" placeholder="Buscar..." aria-label="Buscar noticias">
      </div>
    </div>
  </header>

  <main class="main">
    <section class="filters" aria-label="Filtros">
      <div class="filters__section filters__section--categories">
        <div class="segmented-control" id="segmented-control" role="radiogroup" aria-label="Filtrar por categor&iacute;a">
          <div class="segmented-control__indicator" id="segmented-indicator"></div>
          <button type="button" class="segmented-control__item" data-cat="lanzamiento" role="radio" aria-checked="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
            <span>Lanzamiento</span>
          </button>
          <button type="button" class="segmented-control__item" data-cat="actualizacion" role="radio" aria-checked="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
            <span>Actualizaci&oacute;n</span>
          </button>
          <button type="button" class="segmented-control__item" data-cat="rumor" role="radio" aria-checked="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/></svg>
            <span>Rumor</span>
          </button>
          <button type="button" class="segmented-control__item" data-cat="analisis" role="radio" aria-checked="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
            <span>An&aacute;lisis</span>
          </button>
        </div>
      </div>
      <div class="filters__blocks" id="filter-blocks" role="group" aria-label="Filtros de juego y plataforma">
        <div class="filters__platforms" id="filter-platforms" role="group" aria-label="Plataformas"></div>
        <div class="filters__games" id="filter-games" role="group" aria-label="Juegos"></div>
      </div>
      <div class="filters__actions">
        <button type="button" class="btn btn--ghost" id="clear-filters" aria-label="Limpiar filtros">Limpiar</button>
      </div>
    </section>

    <section class="news-grid" id="news-grid" aria-live="polite" aria-label="Noticias">
      <div class="state state--loading" id="state-loading" aria-live="assertive" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p>Cargando noticias...</p>
      </div>
      <div class="state state--error" id="state-error" hidden>
        <svg class="error__icon" aria-hidden="true" viewBox="0 0 24 24" width="48" height="48">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="15" y1="9" x2="9" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="9" y1="9" x2="15" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h2 id="error-title">Error al cargar</h2>
        <p id="error-message">No se pudieron cargar las noticias.</p>
        <button type="button" class="btn btn--primary" id="retry-btn">Reintentar</button>
      </div>
      <div class="state state--empty" id="state-empty" hidden>
        <svg class="empty__icon" aria-hidden="true" viewBox="0 0 24 24" width="48" height="48">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z" fill="currentColor"/>
          <path d="M11 7h2v2h-2zm0 4h2v6h-2z" fill="currentColor" opacity="0.5"/>
        </svg>
        <h2>No hay noticias</h2>
        <p>No hay noticias que coincidan con los filtros actuales.</p>
      </div>
      <div class="news-grid__list state" id="news-list" role="list" aria-label="Noticias" hidden></div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <span id="stats-count">0</span><span class="footer__separator">&middot;</span>
      <span>Actualizado <span id="stats-updated">&mdash;</span></span>
      <span class="footer__separator">&middot;</span>
      <span class="footer__tech">Pipeline: Ollama &rarr; Groq</span>
      <span class="footer__separator">&middot;</span>
      <a href="https://github.com/MarioMunPeq/Euromario" target="_blank" rel="noopener" class="footer__link">v0.1.0</a>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
